name: Test build (Windows companion)

on:
  push:
    branches:
      - gamebar-xbox-persona
  workflow_dispatch:

env:
  PICO_SDK_REF: 2.3.0
  TINYUSB_REF: 2d56dc533e45e4e91b15e93fdab5e22e964f328d
  PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk

jobs:
  companion:
    name: Build Windows companion installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Set up Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1.12.3
        with:
          release: '15.2.Rel1'

      - name: Install firmware build dependencies
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          arm-none-eabi-gcc --version
          ninja --version

      - name: Download Pico SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:PICO_SDK_REF" https://github.com/raspberrypi/pico-sdk.git "$env:PICO_SDK_PATH"
          git -C "$env:PICO_SDK_PATH" submodule update --init --recursive

      - name: Switch TinyUSB to configured revision
        shell: pwsh
        run: |
          $tinyUsbPath = Join-Path $env:PICO_SDK_PATH 'lib/tinyusb'
          git -C "$tinyUsbPath" rev-parse -q --verify "$env:TINYUSB_REF^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C "$tinyUsbPath" fetch --depth 1 origin "$env:TINYUSB_REF"
          }
          git -C "$tinyUsbPath" checkout --detach "$env:TINYUSB_REF"

      - name: Install companion dependencies
        working-directory: companion
        run: npm ci

      - name: Build Windows companion installer
        working-directory: companion
        run: npm run installer:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DS5-Bridge-Companion-Setup-gamebar-test
          path: companion/artifacts/installer/DS5-Bridge-Companion-Setup-*.exe
          if-no-files-found: error
